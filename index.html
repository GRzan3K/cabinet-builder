<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0"

    <title>Cabinet Builder</title>
   
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main>

        <h1>Konstruktor szafek</h1>
        <form id="cabinet-form">

            <label for="width">
                Szerokość szafki [mm]
            </label>
            <input 
            id="width"
            type="number"
            min="1"
            required
            >
            
            <label for="height">
                Wysokość szafki [mm]
            </label>
            <input id="height"
            id="height"
            type="number"
            min="1"
            required
            >

            <label for="depth">
                Głębokość szafki [mm]
            </label>
            <input for="depth"
            id="depth"
            type="number"
            min="1"
            required
            >

            <label for="shelves">
                Liczba półek
            </label>
            <input id="shelves"
            id="shelves"
            type="number"
            min="0"
            value="0"
            step="1"
            >

            <select id="shelf-offset">
                <option value="20">20 mm</option>
                <option value="15">15 mm</option>
            </select>

            <p id="error-message"></p>

            <button type="submit">
                Oblicz elementy
            </button>


        </form>

        <section id="results">

            <h2>Lista elementów</h2>

            <table>
                <thead>
                    <tr>
                        <th>Element</th>
                        <th>Ilość</th>
                        <th>Wymiary</th>
                    </tr>
                </thead>

                <tbody id="results-body">
                    
                </tbody>
            </table>

        </section>

    </main>

    <script src="app.js"></script>
</body>


</html>
