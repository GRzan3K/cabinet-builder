<!DOCTYPE html>

<html lang="pl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0" >
    
    <title>Kalkulator materiału</title>
    <link rel="stylesheet" href="style.css">


</head>

<body>

    <h1>Kalkulator materiału</h1>

    <label for="width">
        Szerokość szafki [mm]
    </label>
    <input
    id="width"
    type="number">

    <label for="thickness">
        Grubość płyty [mm]
    </label>
    <input
    id="thickness"
    type="number">

    <label for="height">
        Wysokość płyty [mm]
    </label>
    <input
    id="height"
    type="number">
    <label for="depth">
        Głębokość [mm]
    </label>
    <input 
    id="depth"
    type="number">

    <button id="calculate">
        Oblicz
    </button>

    <p id="result"></p>
    <script src="app.js"></script>


    

</body>

</html>
